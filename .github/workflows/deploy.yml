name: Deploy DJ Tommy Scott to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Extract uploaded slideshow archive
        run: |
          if [ -f DJTS_Website_Photos.zip ]; then
            unzip -o -q DJTS_Website_Photos.zip
          fi
      - name: Build slideshow photo list
        run: |
          python3 - <<'PY'
          import json, pathlib
          folder = pathlib.Path('images/slideshow')
          files = sorted(str(p.relative_to(folder)) for p in folder.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif'})
          pathlib.Path('slideshow.json').write_text(json.dumps(files, ensure_ascii=False), encoding='utf-8')
          print(f'{len(files)} slideshow photos found')
          PY
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
          skip_app_build: true
